[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tet2isr"
version = "0.1.0"
description = "Transferable translatomic rules for genotype-dependent ISR responses in TET2-deficient HSPCs"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "pyarrow", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tet2isr = "tet2isr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
