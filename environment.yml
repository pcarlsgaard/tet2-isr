# Conda alternative to requirements.lock. The R block is only needed for the confirmatory
# DESeq2 deltaTE / anota2seq analysis on real count data (not used by the smoke test).
name: tet2isr
channels: [conda-forge, bioconda]
dependencies:
  - python=3.13
  - numpy=2.5
  - pandas=3.1
  - scipy=1.18
  - matplotlib=3.11
  - pyarrow=26
  - pyyaml
  - pytest
  - make
  # optional, real data only:
  # - r-base=4.4
  # - bioconductor-deseq2
  # - bioconductor-anota2seq
